name: build

# Every push and pull request builds the AppImage and the Windows zip (downloadable from the run's
# artifacts). Pushing a tag vX.Y.Z (matching VERSION in version.py) also publishes both as a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe for the version in the file name
      - name: Build AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/Underrail_Save_Editor-*.AppImage  # not the cached appimagetool next to it
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyinstaller PySide6-Essentials pillow
      - name: Build exe
        run: |
          python packaging/make_icon.py build
          pyinstaller --noconfirm --distpath build/dist --workpath build/work packaging/underrail-save-editor.spec
      - name: Zip
        shell: pwsh
        run: |
          $version = git describe --tags --always
          Compress-Archive -Path build/dist/UnderrailSaveEditor -DestinationPath "build/UnderrailSaveEditor-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches version.py
        run: |
          version=$(python3 -c 'import version; print(version.VERSION)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match VERSION = '$version' in version.py"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
