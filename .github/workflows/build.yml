name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe for the version in the file name
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyinstaller PySide6-Essentials pillow
      - name: Build exe
        run: |
          python packaging/make_icon.py build
          pyinstaller --noconfirm --distpath build/dist --workpath build/work packaging/underrail-save-editor.spec
      - name: Zip
        shell: pwsh
        run: |
          $version = git describe --tags --always
          Compress-Archive -Path build/dist/UnderrailSaveEditor -DestinationPath "build/UnderrailSaveEditor-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
