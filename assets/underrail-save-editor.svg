      <stop offset="0" stop-color="#3a3f3a"/>
      <stop offset="1" stop-color="#1c1f1c"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8783a"/>
      <stop offset="1" stop-color="#8a4a1f"/>
    </linearGradient>
  </defs>
  <!-- background tile -->
  <rect x="12" y="12" width="232" height="232" rx="40" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="40" fill="none" stroke="#5c6b4f" stroke-width="6"/>
  <!-- floppy disk (save game) -->
  <path d="M64 56 h104 l28 28 v112 a8 8 0 0 1 -8 8 h-124 a8 8 0 0 1 -8 -8 v-132 a8 8 0 0 1 8 -8 z" fill="url(#disk)"/>
  <rect x="86" y="56" width="72" height="44" rx="4" fill="#2a2d2a"/>
  <rect x="134" y="64" width="14" height="28" rx="2" fill="#c8783a"/>
  <rect x="80" y="128" width="96" height="64" rx="6" fill="#e9e2cf"/>
  <rect x="92" y="144" width="72" height="6" rx="3" fill="#8a8574"/>
  <rect x="92" y="160" width="56" height="6" rx="3" fill="#8a8574"/>
  <rect x="92" y="176" width="64" height="6" rx="3" fill="#8a8574"/>
  <!-- wrench (editor) -->
  <g transform="rotate(-45 176 176)">
    <rect x="166" y="150" width="20" height="78" rx="8" fill="#b9c2b0" stroke="#1c1f1c" stroke-width="4"/>
